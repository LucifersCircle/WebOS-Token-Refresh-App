<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebOS Dev Mode Token</title>
    <link rel="stylesheet" href="alert.css">
</head>
<body>
    <main id="app-container">
        <div id="main-content" role="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
            <header>
                <h1 id="dialog-title">Automatic webOS Token Refresh</h1>
                <p id="dialog-description" aria-live="polite">Checking automatic renewal…</p>
            </header>
            <section id="token-section" aria-label="Developer mode token">
                <p>Your token</p>
                <code id="token">Fetching token…</code>
            </section>
            <section id="response-section" aria-label="Server response" aria-live="polite">
                <p id="response"></p>
            </section>
            <p id="info-section">After selecting “Renew Automatically”, you can uninstall this app.<br>
                Your token will continue to be refreshed automatically.</p>
            <div id="button-container">
                <button id="renew-btn" type="button" hidden onclick="renewToken()">Renew Automatically</button>
                <button id="remove-btn" type="button" hidden onclick="removeToken()">Stop Auto Renewal</button>
                <button id="retry-btn" type="button" hidden onclick="checkRegistration()">Check Again</button>
                <button id="toggle-log-btn" type="button" aria-controls="log-section" aria-expanded="false" onclick="toggleLog()">Show Log</button>
            </div>
            <section id="log-section" aria-label="App log" aria-hidden="true">
                <h2>App Log</h2>
                <div id="log-content" role="log" aria-live="off"></div>
            </section>
            <footer>Powered by <a href="https://lg.pirate.vodka" target="_blank" rel="noopener">lg.pirate.vodka</a></footer>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
